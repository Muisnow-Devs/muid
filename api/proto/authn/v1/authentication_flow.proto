syntax = "proto3";

package muid.authn.v1;

import "authn/v1/basic.proto";
import "authn/v1/challenge.proto";
import "authn/v1/proof.proto";
import "authn/v1/session.proto";
import "buf/validate/validate.proto";

option go_package = "sanzi.io/muid/api/proto/authn/v1;authn";

service AuthenticationFlowService {
  rpc StartLogin(StartLoginRequest) returns (StartLoginResponse);
  rpc ContinueLogin(ContinueLoginRequest) returns (ContinueLoginResponse);
}

message StartLoginRequest {
  muid.authn.v1.basic.AuthMethod method = 1;
  string identifier = 2 [(buf.validate.field).string.max_len = 256];
  // intent defaults to AUTH_INTENT_LOGIN when unset.
  muid.authn.v1.basic.AuthIntent intent = 3;
  // Session token for AUTH_INTENT_LINK_ACCOUNT and AUTH_INTENT_REAUTHENTICATE is
  // passed via the authorization metadata header: "Session <token>".
  // Client locale, timezone, device context, and IP are gRPC metadata only (see pkg/clientmeta):
  // x-client-locale, x-client-timezone, x-client-device, x-client-location,
  // x-client-user-agent, x-client-ip (set by the gateway). Login-alert secure_link is
  // AUTHN_LOGIN_ALERT_SECURE_LINK, not client metadata.
}

message StartLoginResponse {
  string transition_id = 1 [(buf.validate.field).string.uuid = true];
  muid.authn.v1.challenge.AuthChallenge challenge = 2;
}

message ContinueLoginRequest {
  string transition_id = 1 [(buf.validate.field).string.uuid = true];
  muid.authn.v1.proof.AuthProof proof = 2;
  // Session token for AUTH_INTENT_LINK_ACCOUNT is passed via the authorization
  // metadata header: "Session <token>".
}

message ContinueLoginResponse {
  string transition_id = 1 [(buf.validate.field).string.uuid = true];
  muid.authn.v1.basic.AuthStatus status = 2;

  oneof result {
    muid.authn.v1.session.ChallengeRequired challenge_required = 3;
    muid.authn.v1.session.AuthSuccess auth_success = 4;
    // field 5 (auth_failure) removed: failures are now gRPC errors with AuthFailure as error detail
  }
}
