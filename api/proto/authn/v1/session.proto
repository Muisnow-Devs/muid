syntax = "proto3";

package muid.authn.v1.session;

import "authn/v1/challenge.proto";
import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";

option go_package = "sanzi.io/muid/api/proto/authn/v1/session;session";

enum AuthLevel {
  AUTH_LEVEL_UNSPECIFIED = 0;
  AUTH_LEVEL_LOW = 1;
  AUTH_LEVEL_MEDIUM = 2;
  AUTH_LEVEL_HIGH = 3;
}

// SessionToken is the long-lived opaque token (refresh-token role). It is the
// only credential AuthnService RPCs accept for authentication; it can be
// exchanged for a short-lived AccessToken via IssueAccessToken.
message SessionToken {
  string value = 1 [(buf.validate.field).string = {
    pattern: "^[A-Za-z0-9_-]{22}\\.[A-Za-z0-9_-]{43}$"
    len: 66
  }];
}

// AccessToken is a short-lived (max 5 minutes) RS256 JWT for CDN / gateway
// fast-path verification. Callers verify it locally against the JWKS served
// by AuthnService.GetPublicKeys; it is NEVER accepted as authentication by
// any AuthnService RPC and is distinct from OIDC provider access tokens
// (header typ "muid-session+jwt", claim token_use "session").
message AccessToken {
  string value = 1; // compact JWS
  google.protobuf.Timestamp issued_at = 2;
  google.protobuf.Timestamp expires_at = 3;
}

message SessionContext {
  muid.authn.v1.session.SessionToken session_token = 1;

  google.protobuf.Timestamp issued_at = 2;
  google.protobuf.Timestamp expires_at = 3;

  // Short-lived JWT issued alongside the session token. Present only when the
  // access-token feature is configured on authn; absent otherwise.
  AccessToken access_token = 4;
}

message AuthenticatedResult {
  string user_id = 1;

  SessionContext session_context = 2;
  AuthLevel auth_level = 3;
}

message AuthenticatedPrincipal {
  string user_id = 1 [(buf.validate.field).string.uuid = true];
  AuthLevel auth_level = 2;
  google.protobuf.Timestamp issued_at = 3;
  google.protobuf.Timestamp expires_at = 4;
  // Email address associated with the authenticated user. Empty when unavailable.
  string email = 5;
}

message ChallengeRequired {
  muid.authn.v1.challenge.AuthChallenge challenge = 1;
}

message AuthSuccess {
  AuthenticatedResult result = 1;
}

// AuthErrorCode identifies the specific reason for an authentication failure.
// Values are stable and suitable for client-side branching logic.
enum AuthErrorCode {
  AUTH_ERROR_CODE_UNSPECIFIED = 0;
  AUTH_ERROR_CODE_AUTHENTICATION_FAILED = 1; // wrong credentials (OTP, passkey, …)
  AUTH_ERROR_CODE_RATE_LIMITED = 2; // resend or attempt throttled
  AUTH_ERROR_CODE_INVALID_SESSION_STATE = 3; // unexpected flow state
  AUTH_ERROR_CODE_INVALID_INPUT = 4; // bad identifier, payload, …
  AUTH_ERROR_CODE_IDENTITY_ALREADY_LINKED = 5; // link-account: identity already linked
  AUTH_ERROR_CODE_LINK_UNAUTHORIZED = 6; // link-account: not authorised
  AUTH_ERROR_CODE_OIDC_MANUAL_LINK_REQUIRED = 7; // OIDC: existing account needs manual link
}

// AuthFailure is returned as a gRPC error detail (see google.rpc.Status details)
// so clients can extract the structured error code alongside the gRPC status code.
message AuthFailure {
  string reason = 1; // human-readable explanation
  AuthErrorCode error_code = 2; // machine-readable code
}
