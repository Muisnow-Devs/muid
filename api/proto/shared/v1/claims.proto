syntax = "proto3";

package muid.shared.v1.claims;
import "buf/validate/validate.proto";

option go_package = "sanzi.io/muid/api/proto/shared/v1/claims;claims";

message IdentityInformation {
  // This should acts like display_name
  optional string name = 1 [(buf.validate.field).string.max_len = 32];
  // This should acts like username, but is never derived from email local part; always auto-allocated to a random value (e.g. user_ + hex) if not provided, and immutable after creation.
  // Charset at runtime: ASCII letters, digits, underscore; length 5–32 when set. See pkg/validation for update rules.
  optional string username = 2 [(buf.validate.field).string = { min_len: 5, max_len: 32, pattern: "^[a-zA-Z0-9_]{5,32}$" }];
  optional string given_name = 3 [(buf.validate.field).string.max_len = 64];
  optional string family_name = 4 [(buf.validate.field).string.max_len = 64];

  optional string picture = 5;
  optional string locale  = 6 [(buf.validate.field).string.max_len = 32];

  optional string email          = 7 [(buf.validate.field).string.email = true];
  optional bool   email_verified = 8;
}