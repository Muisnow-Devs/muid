syntax = "proto3";

package muid.profile.v1;

import "buf/validate/validate.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";
import "shared/v1/claims.proto";

option go_package = "sanzi.io/muid/api/proto/profile/v1;profile";

service ProfileService {
  rpc CreateProfile(CreateProfileRequest) returns (CreateProfileResponse);
  rpc GetProfile(GetProfileRequest) returns (GetProfileResponse);
  rpc UpdateProfile(UpdateProfileRequest) returns (UpdateProfileResponse);

  // Presigned PUT to Cloudflare R2 (S3-compatible). Client uploads bytes, then calls CompleteAvatarUpload.
  rpc StartAvatarUpload(StartAvatarUploadRequest) returns (StartAvatarUploadResponse);
  rpc CompleteAvatarUpload(CompleteAvatarUploadRequest) returns (CompleteAvatarUploadResponse);
}

message CreateProfileRequest {
  string email = 1 [(buf.validate.field).string.email = true];
  // Optional OIDC-style claims: display name is taken from claims when resolvable, otherwise random; username is always auto-allocated (never from email); picture triggers async avatar bootstrap when https.
  optional muid.shared.v1.claims.IdentityInformation identity = 2;
}

message CreateProfileResponse {
  string id = 1 [(buf.validate.field).string.uuid = true];
}

message GetProfileRequest {
  string id = 1 [(buf.validate.field).string.uuid = true];
}

message GetProfileResponse {
  string id = 1;
  string email = 2;
  string display_name = 3;
  string username = 4 [(buf.validate.field).string = {
    min_len: 5
    max_len: 16
    pattern: "^[a-z0-9][a-z0-9_.]{4,15}$"
  }];
  string avatar_url = 5;
  string locale = 6;
  string avatar_object_key = 7;

  // This is for backwards compatibility with the event schema.
  // Newer account shouldn't have this field populated.
  optional string original_identity = 8;
}

message UpdateProfileRequest {
  string id = 1 [(buf.validate.field).string.uuid = true];
  // Mask paths are relative to this message: proto snake_case prefix `identity.` for
  // IdentityInformation fields (e.g. "identity.email", "identity.name", "identity.username").
  // JSON clients may send camelCase in the second segment (e.g. "identity.emailVerified");
  // the server normalizes to canonical snake_case paths.
  google.protobuf.FieldMask update_mask = 2;
  // Values for fields listed in update_mask; only allowlisted paths are applied.
  optional muid.shared.v1.claims.IdentityInformation identity = 3;
}

message UpdateProfileResponse {
  string id = 1 [(buf.validate.field).string.uuid = true];
}

message StartAvatarUploadRequest {
  string user_id = 1 [(buf.validate.field).string.uuid = true];
  string content_type = 2 [(buf.validate.field).string = {
    min_len: 3
    max_len: 128
  }];
}

message StartAvatarUploadResponse {
  string upload_url = 1;
  string object_key = 2;

  google.protobuf.Timestamp expires_at = 3;
}

message CompleteAvatarUploadRequest {
  string user_id = 1 [(buf.validate.field).string.uuid = true];
  string object_key = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 512
  }];
  int64 byte_size = 3 [(buf.validate.field).int64 = {gte: 1}];
}

message CompleteAvatarUploadResponse {
  string avatar_url = 1;
}
