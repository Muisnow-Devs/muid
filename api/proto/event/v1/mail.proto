syntax = "proto3";

package muid.event.v1.mail;

import "google/protobuf/timestamp.proto";

option go_package = "sanzi.io/muid/api/proto/event/v1/mail;mail";

message EmailAddress {
  string email = 1;
  string name = 2;
}

message EmailMessage {
  string id = 1;

  repeated EmailAddress to = 3;
  string subject = 4;

  string template = 5;
  string locale = 6;

  map<string, string> data = 7;

  google.protobuf.Timestamp created_at = 8;
}

message SendOTPEmailEvent {
  string id = 1;

  string email = 2;
  string locale = 3;

  string code = 4;

  google.protobuf.Timestamp expires_at = 5;
  google.protobuf.Timestamp created_at = 6;

  // IANA time zone (e.g. "Asia/Taipei"). Empty means UTC for display.
  string timezone = 7;
}

message SendEmailChangedEvent {
  string id = 1;

  string email = 2;
  string locale = 3;

  string old_email = 4;
  string new_email = 5;

  google.protobuf.Timestamp occurred_at = 6;
  google.protobuf.Timestamp created_at = 7;

  // IANA time zone (e.g. "Asia/Taipei"). Empty means UTC for display.
  string timezone = 8;
}

message SendPasskeyAddedEmailEvent {
  string id = 1;

  string email = 2;
  string locale = 3;

  string passkey_name = 4;

  google.protobuf.Timestamp occurred_at = 5;
  google.protobuf.Timestamp created_at = 6;

  // IANA time zone (e.g. "Asia/Taipei"). Empty means UTC for display.
  string timezone = 7;
}

message SendLoginAlertEmailEvent {
  string id = 1;

  string email = 2;
  string locale = 3;

  string ip_address = 4;
  string location = 5;
  string device = 6;
  string user_agent = 7;

  string secure_link = 8;

  google.protobuf.Timestamp occurred_at = 9;
  google.protobuf.Timestamp created_at = 10;

  // IANA time zone (e.g. "Asia/Taipei"). Empty means UTC for display.
  string timezone = 11;
}

// SendAccountLinkedEmailEvent is published on mail.send.account_linked after a user
// successfully links a new sign-in method (OIDC, email OTP, passkey) to their account.
message SendAccountLinkedEmailEvent {
  string id = 1;

  string email = 2;
  string locale = 3;

  // Identity provider name (e.g. "google", "email", "passkey").
  string provider = 4;

  google.protobuf.Timestamp occurred_at = 5;
  google.protobuf.Timestamp created_at = 6;

  // IANA time zone (e.g. "Asia/Taipei"). Empty means UTC for display.
  string timezone = 7;
}
