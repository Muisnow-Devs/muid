# ---------------------------------------------------------------------------
# Dev-container compose file
# The "devcontainer" service is the main workspace; the rest are infra
# dependencies that mirror the production environment.
# ---------------------------------------------------------------------------

services:
    # ── Main dev workspace ─────────────────────────────────────────────────
    devcontainer:
        build:
            context: ..
            dockerfile: .devcontainer/Dockerfile
        volumes:
            - ..:/workspace:cached
            # Persist Go module cache across container rebuilds
            - go-mod-cache:/root/go/pkg/mod
            # Persist Go build cache
            - go-build-cache:/root/.cache/go-build
        # Keep container alive
        command: sleep infinity
        ports:
            - 8080:8080
            - 8081:8081
            - 8082:8082
            - 8083:8083
            # Gateways. Defaults are 8080-8082 (production: one container each),
            # but those collide with the in-container backends here, so the dev
            # gateways run on 9080-9082.
            - 9080:9080
            - 9081:9081
            - 9082:9082
        depends_on:
            - postgres
            - nats
            - redis
        env_file:
            - path: ./.env
              required: false
        environment:
            # Convenience: point services at the compose network hostnames.
            # Secrets / per-developer values (AUTHN_OTP_SECRET_KEY, MAILER_SMTP_*,
            # AUTHN_OIDC_CLIENTS_JSON, optional PROFILE_R2_* for avatar uploads)
            # belong in the local .env file — compose `environment:` entries
            # would override it, so never duplicate .env keys here.

            # ── authn ────────────────────────────────────────────────────────
            AUTHN_DATABASE_URL: "postgres://muid:muid@postgres:5432/muid_authn?sslmode=disable"
            AUTHN_NATS_URL: "nats://nats:4222"
            AUTHN_PORT: "8080"
            AUTHN_PROFILE_GRPC_ADDR: "localhost:8081"
            # Authz *internal* listener (service-to-service surface); dialed by
            # the local enforcer when the OIDC provider is enabled.
            AUTHN_AUTHZ_GRPC_ADDR: "localhost:8083"
            REDIS_ADDR: "redis:6379"

            # ── profile ──────────────────────────────────────────────────────
            PROFILE_DATABASE_URL: "postgres://muid:muid@postgres:5432/muid_profile?sslmode=disable"
            PROFILE_NATS_URL: "nats://nats:4222"
            PROFILE_PORT: "8081"

            # ── authz ────────────────────────────────────────────────────────
            AUTHZ_DATABASE_URL: "postgres://muid:muid@postgres:5432/muid_authz?sslmode=disable"
            AUTHZ_NATS_URL: "nats://nats:4222"
            AUTHZ_PORT: "8082"
            # Internal listener: AuthzService + AuthzAdminService. Reached as
            # localhost inside the devcontainer; intentionally not published to
            # the host (must never be gateway-exposed).
            AUTHZ_INTERNAL_PORT: "8083"

            # ── mailer ───────────────────────────────────────────────────────
            MAILER_NATS_URL: "nats://nats:4222"

            # ── gateways (run manually inside the devcontainer) ──────────────
            # public: untrusted-internet edge fronting OIDC REST + JWKS.
            GATEWAY_PUBLIC_PORT: "9080"
            GATEWAY_PUBLIC_AUTHN_GRPC_ADDR: "localhost:8080"
            GATEWAY_PUBLIC_REDIS_ADDR: "redis:6379"
            # services: trusted gRPC BFF edge (mTLS + JWT + rate limiting).
            GATEWAY_SERVICES_PORT: "9081"
            GATEWAY_SERVICES_AUTHN_GRPC_ADDR: "localhost:8080"
            GATEWAY_SERVICES_PROFILE_GRPC_ADDR: "localhost:8081"
            GATEWAY_SERVICES_REDIS_ADDR: "redis:6379"
            GATEWAY_SERVICES_SESSION_ACCESS_TOKEN_ISSUER: "http://localhost:9080"
            # internal: ops/admin edge onto the internal gRPC admin surfaces.
            GATEWAY_INTERNAL_PORT: "9082"
            GATEWAY_INTERNAL_AUTHN_GRPC_ADDR: "localhost:8080"
            GATEWAY_INTERNAL_AUTHZ_INTERNAL_GRPC_ADDR: "localhost:8083"
            GATEWAY_INTERNAL_REDIS_ADDR: "redis:6379"
            GATEWAY_INTERNAL_SESSION_ACCESS_TOKEN_ISSUER: "http://localhost:9080"
        networks:
            - muid-dev

    # ── PostgreSQL ─────────────────────────────────────────────────────────
    postgres:
        image: postgres:17-alpine
        restart: unless-stopped
        environment:
            POSTGRES_USER: muid
            POSTGRES_PASSWORD: muid
            POSTGRES_DB: muid_authn
        volumes:
            - postgres-data:/var/lib/postgresql/data
            # Create the profile database on first start
            - ./.init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
        # No host port binding — the devcontainer reaches postgres via the
        # internal network hostname. If you need psql from the host, use
        # `docker exec` or set up a separate port mapping manually.
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U muid"]
            interval: 10s
            timeout: 5s
            retries: 5
        networks:
            - muid-dev

    # ── NATS ───────────────────────────────────────────────────────────────
    nats:
        image: nats:2-alpine
        restart: unless-stopped
        # No host port binding — reachable as nats:4222 inside the network.
        command: ["-js", "-m", "8222"]
        networks:
            - muid-dev

    # ── Redis ──────────────────────────────────────────────────────────────
    redis:
        image: redis:7-alpine
        restart: unless-stopped
        # No host port binding — reachable as redis:6379 inside the network.
        volumes:
            - redis-data:/data
        networks:
            - muid-dev

networks:
    muid-dev:
        driver: bridge

volumes:
    postgres-data:
    redis-data:
    go-mod-cache:
    go-build-cache:
