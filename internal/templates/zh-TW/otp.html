<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>您的一次性密碼</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol";
            background-color: #ffffff;
            color: #333333;
            margin: 0;
            padding: 0;
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 40px 20px;
            text-align: left;
        }

        .logo {
            margin-bottom: 32px;
        }

        .logo img {
            max-height: 50px;
            display: block;
        }

        h1 {
            font-size: 24px;
            font-weight: 600;
            color: #111111;
            margin-bottom: 16px;
            margin-top: 0;
        }

        p {
            font-size: 16px;
            color: #555555;
            margin-top: 0;
            margin-bottom: 24px;
        }

        .otp-container {
            background-color: #f4f4f5;
            border-radius: 6px;
            padding: 24px;
            margin-bottom: 32px;
            display: inline-block;
        }

        .otp-code {
            font-size: 32px;
            font-weight: 700;
            letter-spacing: 6px;
            color: #111111;
            margin: 0;
        }

        .footer {
            margin-top: 48px;
            padding-top: 24px;
            border-top: 1px solid #eaeaea;
            font-size: 14px;
            color: #888888;
        }

        .footer p {
            margin-bottom: 8px;
            font-size: 14px;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="logo">
            <img src="https://objects.sanziusercontent.com/full_logo.webp" alt="Muisnow Devs" width="150" height="50"
                style="border: 0; outline: none; text-decoration: none;" />
        </div>

        <h1>驗證您的登入</h1>
        <p>請使用下面的驗證碼進行登入。請於 {{ .ExpiryTime }} 之前使用，否則將失效。</p>

        <div class="otp-container">
            <div class="otp-code">{{ .OTP }}</div>
        </div>

        <p>如果您沒有請求此電子郵件，可以安全地忽略它。</p>

        <div class="footer">
            <p>&copy; Muisnow Devs.</p>
        </div>
    </div>
</body>

</html>
