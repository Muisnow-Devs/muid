syntax = "proto3";

package muid.authn.v1;

import "authn/v1/basic.proto";
import "authn/v1/challenge.proto";
import "authn/v1/proof.proto";
import "authn/v1/session.proto";
import "buf/validate/validate.proto";

option go_package = "sanzi.io/muid/api/proto/authn/v1;authn";

service AuthnService {
  /// authentication APIs
  rpc StartAuthSession(StartAuthSessionRequest) returns (StartAuthSessionResponse);
  rpc ContinueAuthSession(ContinueAuthSessionRequest) returns (ContinueAuthSessionResponse);

  /// user related APIs, for user to manage their sessions.
  rpc RevokeFederatedIdentity(RevokeFederatedIdentityRequest) returns (RevokeFederatedIdentityResponse);
  rpc GetAuthorizedSession(GetAuthorizedSessionRequest) returns (GetAuthorizedSessionResponse);
  // Resolves a session into an authenticated principal for downstream services.
  rpc GetAuthenticatedPrincipal(GetAuthenticatedPrincipalRequest) returns (GetAuthenticatedPrincipalResponse);

  // user session management APIs
  rpc RevokeSession(RevokeSessionRequest) returns (RevokeSessionResponse);
}

message StartAuthSessionRequest {
  muid.authn.v1.basic.AuthMethod method = 1;
  string identifier = 2 [(buf.validate.field).string.max_len = 256];
  // intent defaults to AUTH_INTENT_LOGIN when unset.
  muid.authn.v1.basic.AuthIntent intent = 3;
  // Required for AUTH_INTENT_LINK_ACCOUNT (and reauth-sensitive flows): proves an active session.
  muid.authn.v1.session.SessionToken session_token = 4;
  // Client locale for mail templates (BCP-47); empty defaults to "en".
  string locale = 5 [(buf.validate.field).string.max_len = 32];
  // IANA time zone for mail timestamps (e.g. "Asia/Taipei"); empty means UTC.
  string timezone = 6 [(buf.validate.field).string.max_len = 64];
}

message StartAuthSessionResponse {
  string transition_id = 1 [(buf.validate.field).string.uuid = true];
  muid.authn.v1.challenge.AuthChallenge challenge = 2;
}

message ContinueAuthSessionRequest {
  string transition_id = 1 [(buf.validate.field).string.uuid = true];
  muid.authn.v1.proof.AuthProof proof = 2;
  // Optional; required to return session context after AUTH_INTENT_LINK_ACCOUNT completes.
  muid.authn.v1.session.SessionToken session_token = 3;
}

message ContinueAuthSessionResponse {
  string transition_id = 1 [(buf.validate.field).string.uuid = true];
  muid.authn.v1.basic.AuthStatus status = 2;

  oneof result {
    muid.authn.v1.session.ChallengeRequired challenge_required = 3;
    muid.authn.v1.session.AuthSuccess auth_success = 4;
    muid.authn.v1.session.AuthFailure auth_failure = 5;
  }
}

message GetAuthorizedSessionRequest {
  muid.authn.v1.session.SessionToken session_token = 1;
}

message GetAuthorizedSessionResponse {
  bool valid = 1;
  muid.authn.v1.session.AuthenticatedResult session = 2;
}

message GetAuthenticatedPrincipalRequest {
  muid.authn.v1.session.SessionToken session_token = 1;
}

message GetAuthenticatedPrincipalResponse {
  bool valid = 1;
  muid.authn.v1.session.AuthenticatedPrincipal principal = 2;
}

message RevokeFederatedIdentityRequest {
  muid.authn.v1.session.SessionToken session_token = 1;
  string provider = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 50
  }];
}

message RevokeFederatedIdentityResponse {
  bool success = 1;
}

message RevokeSessionRequest {
  muid.authn.v1.session.SessionToken session_token = 1;
}

message RevokeSessionResponse {
  bool success = 1;
}
