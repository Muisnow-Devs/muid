syntax = "proto3";

package muid.authn.v1.basic;

option go_package = "sanzi.io/muid/api/proto/authn/v1/basic;basic";

enum AuthMethod {
  AUTH_METHOD_UNSPECIFIED  = 0;
  AUTH_METHOD_EMAIL_OTP    = 1;
  AUTH_METHOD_OAUTH        = 2;
  AUTH_METHOD_PASSKEY      = 3;
  AUTH_METHOD_USERNAME_OTP = 4;
}

enum AuthStatus {
  AUTH_STATUS_UNSPECIFIED          = 0;
  AUTH_STATUS_PENDING              = 1;
  AUTH_STATE_CHALLENGE_REQUIRED    = 2;
  AUTH_STATE_REGISTRATION_REQUIRED = 3;
  AUTH_STATE_AUTHENTICATED         = 4;
  AUTH_STATE_FAILED                = 5;
}

enum AuthIntent {
  AUTH_INTENT_UNSPECIFIED    = 0;
  AUTH_INTENT_LOGIN          = 1;
  AUTH_INTENT_LINK_ACCOUNT   = 2;
  AUTH_INTENT_REAUTHENTICATE = 3;
}
