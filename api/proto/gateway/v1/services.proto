syntax = "proto3";

package muid.gateway.v1;

import "buf/validate/validate.proto";

option go_package = "sanzi.io/muid/api/proto/gateway/v1;gatewayv1";

// ServicesGatewayService is the curated BFF surface of the services gateway,
// reached by the trusted edge (e.g. Cloudflare Workers) over mTLS. The gateway
// authenticates the end user from a session access-token JWT and fulfils each
// RPC by calling backend services with the verified identity attached as
// x-user-id metadata. The narrow, predefined method set is the security
// boundary: the edge can only reach what is declared here.
service ServicesGatewayService {
  // GetMe returns the authenticated caller's profile. Requires a valid session
  // access token; unauthenticated callers receive UNAUTHENTICATED.
  rpc GetMe(GetMeRequest) returns (GetMeResponse);
}

message GetMeRequest {}

message GetMeResponse {
  User user = 1;
}

// User mirrors the public-facing subset of a profile.
message User {
  string id = 1 [(buf.validate.field).string.uuid = true];
  string username = 2;
  string display_name = 3;
  string email = 4;
  string avatar_url = 5;
}
