syntax = "proto3";

package muid.authn.v1;

import "authn/v1/basic.proto";
import "authn/v1/certification.proto";
import "authn/v1/challenge.proto";
import "authn/v1/client.proto";
import "authn/v1/proof.proto";
import "authn/v1/session.proto";

option go_package = "sanzi.io/muid/api/proto/authn/v1;authn";

service AuthnService {
  rpc StartAuthSession(StartAuthSessionRequest) returns (StartAuthSessionResponse);
  rpc ContinueAuthSession(ContinueAuthSessionRequest) returns (ContinueAuthSessionResponse);

  rpc GetPublicKeys(GetPublicKeysRequest) returns (GetPublicKeysResponse);
  rpc GetAuthorizedSession(GetSessionRequest) returns (GetSessionResponse);
  rpc ListAuthorizedClients(ListAuthorizedClientsRequest) returns (ListAuthorizedClientsResponse);

  rpc RevokeSession(RevokeSessionRequest) returns (RevokeSessionResponse);
  rpc RevokeAuthorization(RevokeAuthorizationRequest) returns (RevokeAuthorizationResponse);

  rpc RefreshToken(RefreshTokenRequest) returns (RefreshTokenResponse);
}

message StartAuthSessionRequest {
  muid.authn.v1.basic.AuthMethod method     = 1;
  string                         identifier = 2;
}

message StartAuthSessionResponse {
  string                                session_token = 1;
  muid.authn.v1.challenge.AuthChallenge challenge     = 2;
}

message ContinueAuthSessionRequest {
  string                        session_token = 1;
  muid.authn.v1.proof.AuthProof proof         = 2;
}

message ContinueAuthSessionResponse {
  muid.authn.v1.basic.AuthStatus status        = 1;
  string                         session_token = 2;

  oneof result {
    muid.authn.v1.session.ChallengeRequired    challenge_required    = 3;
    muid.authn.v1.session.RegistrationRequired registration_required = 4;
    muid.authn.v1.session.AuthSuccess          auth_success          = 5;
    muid.authn.v1.session.AuthFailure          auth_failure          = 6;
  }
}

message GetPublicKeysRequest {}

message GetPublicKeysResponse {
  repeated muid.authn.v1.certification.PublicKey public_keys = 1;
}

message GetSessionRequest {
  string session_token = 1;
}

message GetSessionResponse {
  bool                                      valid   = 1;
  muid.authn.v1.session.AuthenticatedResult session = 2;
}

message ListAuthorizedClientsRequest {
  string session_token = 1;
}

message ListAuthorizedClientsResponse {
  repeated muid.authn.v1.client.AuthorizedClient clients = 1;
}

message RevokeSessionRequest {
  string session_token = 1;
}

message RevokeSessionResponse {
  bool success = 1;
}

message RevokeAuthorizationRequest {
  string          session_token = 1;
  string          client_id     = 2;
  repeated string scopes        = 3;
}

message RevokeAuthorizationResponse {
  bool success = 1;
}

message RefreshTokenRequest {
  string refresh_token = 1;
}

message RefreshTokenResponse {
  string access_token  = 1;
  string refresh_token = 2;
  int32  expires_at    = 3;
}