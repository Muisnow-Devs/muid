syntax = "proto3";

package muid.profile.v1;
import "buf/validate/validate.proto";

import "shared/v1/claims.proto";

option go_package = "sanzi.io/muid/api/proto/profile/v1;profile";

service ProfileService {
  rpc CreateProfile(CreateProfileRequest) returns (CreateProfileResponse);
//   rpc GetProfile(GetProfileRequest) returns (GetProfileResponse);
//   rpc UpdateProfile(UpdateProfileRequest) returns (UpdateProfileResponse);

//   rpc StartAvatarUpload(StartAvatarUploadRequest) returns (StartAvatarUploadResponse);
//   rpc CompleteAvatarUpload(CompleteAvatarUploadRequest) returns (CompleteAvatarUploadResponse);

//   rpc ResolveIdentity(ResolveIdentityRequest) returns (ResolveIdentityResponse);
}

// // TODO: Add more fields to profile and support partial update
// // Use FieldMask for partial update if needed
// message Change {
//     optional string display_name = 1;
//     optional string avatar_url = 2;
// }

message CreateProfileRequest {
  string                               email  = 1 [(buf.validate.field).string.email = true];
  muid.shared.v1.claims.IdentityClaims claims = 2;
}

message CreateProfileResponse {
  string id = 1 [(buf.validate.field).string.uuid = true];
}