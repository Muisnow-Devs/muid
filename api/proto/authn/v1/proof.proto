syntax = "proto3";

package muid.authn.v1.proof;
import "buf/validate/validate.proto";

option go_package = "sanzi.io/muid/api/proto/authn/v1/proof;proof";

message AuthProof {
  oneof proof {
    EmailProof   email_proof   = 1;
    OAuthProof   oauth_proof   = 2;
    PasskeyProof passkey_proof = 3;
  }
}

// EmailProof carries either a code check or a resend request for the same transition.
message EmailProof {
  oneof step {
    string otp_code = 1 [(buf.validate.field).string.len = 6];
    EmailResendOtp resend = 2;
  }
}

message EmailResendOtp {}

message OAuthProof {
  string code  = 1;
  string state = 2;
}

message PasskeyProof {
  string credential_assertion_response_json = 1;
  string credential_creation_response_json  = 2;
}